<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--a:#3ec9b0;color:#fff;background:#090807;font-family:'Sora',Arial,sans-serif;font-synthesis:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090807}
.experience{position:relative;width:100%;height:100%;min-height:540px;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,transparent 52%,rgba(0,0,0,.88) 100%);pointer-events:none}
.chrome{position:absolute;z-index:4;transition:opacity .45s ease,filter .45s ease}
.is-transitioning .chrome{opacity:0;filter:blur(8px);pointer-events:none}
.is-transitioning .header,.is-transitioning .planet-list{opacity:1;filter:none;pointer-events:auto}
.header{left:clamp(18px,1.95vw,28px);right:clamp(18px,1.95vw,28px);top:calc(clamp(18px,3.1vh,28px) + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;height:42px}
.logo-text{margin-left:46px;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:15px}.logo-text span{opacity:.6;font-weight:400}
.hr{display:flex;align-items:center;gap:10px}
.nav{display:flex;align-items:center;height:42px;padding:4px 5px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border-radius:999px}
.nav a{color:#fff;text-decoration:none;padding:8px 19px;border-radius:999px;line-height:1;font-size:14px}.nav a.active{background:#fff;color:#000}
.menu{display:none;height:38px;padding:0 18px;border:0;border-radius:999px;background:#fff;color:#000;font:500 13px 'Sora',sans-serif}
.planet-list{left:clamp(18px,1.95vw,28px);top:50%;transform:translateY(-43%);display:flex;flex-direction:column;gap:6px;font-size:16px}
.planet-item{display:flex;align-items:center;min-height:20px;background:none;border:0;color:rgba(255,255,255,.7);font:inherit;padding:0;text-align:left}
.planet-item:hover{color:#fff}.planet-item.active{font-size:18px;font-weight:700;gap:8px;color:#fff}
.planet-item.active:before{content:'';width:16px;height:16px;border-radius:50%;background:#fff}
.portal-wrap{left:50%;top:50%;width:min(320px,31vw);transform:translate(-50%,-54%)}
.portal-heading{display:flex;justify-content:space-between;margin-bottom:12px;font-size:16px;opacity:0}
.portal-heading strong{font-size:18px;margin-left:8px}
.portal{position:relative;display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:320/350;padding:0;border:0;border-radius:90px;background:transparent;color:#fff}
.portal-icon{width:70%;height:70%;opacity:0;pointer-events:none}
.pc{position:absolute;z-index:4;left:clamp(28px,4vw,58px);right:clamp(28px,3vw,44px);bottom:clamp(24px,3vh,30px);display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.pc h1{font-family:'Bebas Neue','Arial Narrow',sans-serif;font-size:clamp(64px,8vw,150px);font-weight:400;line-height:.82;margin:0 0 -.02em;transform:translateX(-14px);opacity:0;max-width:100%}.pc>div{flex:1;min-width:0}
.pc .tag{font-size:13px;color:var(--a);margin:0 0 12px;opacity:0}
dl{flex:none;width:min(447px,34vw);margin:0;font-size:15px}
.fact{display:grid;grid-template-columns:110px 1fr;gap:18px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.48);opacity:0}
.fact:last-child{border-bottom:0}.fact dt{font-weight:700}.fact dd{margin:0}
.mark{position:fixed;z-index:22;left:50%;top:50%;width:58px;height:58px;transform:translate(-50%,-50%);border-radius:14px;background:none;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:all 2s cubic-bezier(.16,1,.3,1)}
.mark img{width:100%;height:100%;display:block;object-fit:contain}
.mark.d{left:clamp(18px,1.95vw,28px);top:calc(clamp(18px,3.1vh,28px) + 3px + env(safe-area-inset-top,0px));width:36px;height:36px;border-radius:9px;font-size:14px;transform:none}
.mark.s{z-index:5}
.count{position:fixed;z-index:22;left:50%;bottom:clamp(22px,3.1vh,28px);display:flex;align-items:flex-end;gap:4px;transform:translateX(-50%);line-height:1}
.count b{font-weight:200;font-size:64px}.count i{font-style:normal;font-size:24px;padding-bottom:4px}
.count.out{animation:cout .75s cubic-bezier(.22,1,.36,1) both}
@keyframes cout{to{opacity:0;filter:blur(7px);transform:translate(-50%,-34px)}}
body:not(.pre) .cur{opacity:0!important}
body:not(.go) .header,body:not(.go) .planet-list{opacity:0}
.go .header{animation:rd .9s cubic-bezier(.22,1,.36,1) .1s both}
.go .planet-list{animation:rs .9s cubic-bezier(.22,1,.36,1) .65s both}
.cr h1{animation:tr 1.05s cubic-bezier(.16,1,.3,1) both}.cr .tag{animation:fr .8s cubic-bezier(.22,1,.36,1) .3s both}
.cr .fact{animation:fr .72s cubic-bezier(.22,1,.36,1) both}.cr .fact:nth-child(1){animation-delay:.52s}.cr .fact:nth-child(2){animation-delay:.68s}.cr .fact:nth-child(3){animation-delay:.84s}.cr .fact:nth-child(4){animation-delay:1s}
.mr .portal-heading{animation:fr .85s cubic-bezier(.22,1,.36,1) .2s both}.mr .portal-icon{animation:ii 1s ease .5s both}
.planet-list.sw .planet-item{animation:mrw .58s cubic-bezier(.22,1,.36,1) both}
.planet-list.sw .planet-item:nth-child(n+2){animation-delay:.05s}.planet-list.sw .planet-item:nth-child(n+4){animation-delay:.12s}.planet-list.sw .planet-item:nth-child(n+6){animation-delay:.2s}
@keyframes rd{from{opacity:0;filter:blur(8px);transform:translateY(-18px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes rs{from{opacity:0;filter:blur(8px);transform:translate(-20px,-43%)}to{opacity:1;filter:blur(0);transform:translate(0,-43%)}}
@keyframes tr{from{opacity:0;filter:blur(12px);transform:translate(-14px,42px)}to{opacity:1;filter:blur(0);transform:translate(-14px,0)}}
@keyframes fr{from{opacity:0;filter:blur(7px);transform:translateY(18px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes ii{from{opacity:0;filter:blur(8px)}to{opacity:1}}
@keyframes mrw{from{opacity:.35;transform:translateX(-8px)}to{opacity:1;transform:none}}
.cur{position:fixed;left:0;top:0;z-index:100;width:1px;height:1px;pointer-events:none;opacity:0;transition:opacity .2s;display:none}
.cur.v{opacity:1}
.cur .dot,.cur .orb{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
.dot{width:12px;height:12px;background:#fff}.orb{width:36px;height:36px;border:1px solid #fff;background:rgba(255,255,255,.4);transition:transform .3s cubic-bezier(.22,1,.36,1)}
.cur.en .orb{transform:translate(-50%,-50%) scale(1.16)}
.lbl{position:absolute;top:26px;left:0;transform:translateX(-50%) translateY(-4px);font-size:16px;opacity:0;white-space:nowrap;transition:all .3s}
.cur.en .lbl{opacity:1;transform:translateX(-50%)}
@media(pointer:fine){html,body,button,a{cursor:none!important}.cur{display:block}}
.modal{position:absolute;inset:0;z-index:30;background:rgba(10,9,8,.8);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.card{width:min(420px,100%);border:1px solid rgba(255,255,255,.18);background:rgba(20,19,18,.92);border-radius:24px;padding:28px}
.card h2{font-family:'Space Grotesk',sans-serif;margin:0 0 6px;font-size:28px}.card p{margin:0 0 20px;opacity:.6;font-size:14px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;margin-bottom:10px;border:1px solid rgba(255,255,255,.18);border-radius:16px;color:#fff;text-decoration:none;background:rgba(255,255,255,.06);font:inherit;text-align:left;transition:border-color .2s,transform .2s}
.row:hover{border-color:var(--a);transform:translateY(-2px)}
.row small{display:block;opacity:.6;font-size:11px;text-transform:uppercase;letter-spacing:.1em}.row svg{width:22px;height:22px;color:var(--a);flex:none}
.about-id{display:flex;align-items:center;gap:14px;margin-bottom:18px}.about-id img{width:52px;height:auto;border-radius:12px}.about-id h2{margin:0;font-size:22px}.about-id p{margin:2px 0 0;font-size:13px;color:var(--a);opacity:1}
.close{float:right;background:none;border:0;color:#fff;opacity:.6;font-size:22px}
@media(max-width:900px){.nav{display:none}.menu{display:block}.portal-wrap{width:min(300px,48vw)}.pc h1{font-size:clamp(60px,12vw,120px)}dl{width:43vw}.fact{grid-template-columns:96px 1fr}.planet-list{font-size:14px}.planet-item.active{font-size:16px}}
@media(max-width:640px){.planet-list{display:none}.portal-wrap{top:38%;width:min(210px,52vw)}.pc{left:18px;right:18px;bottom:18px;display:block}.pc h1{font-size:clamp(52px,14vw,92px);margin-bottom:12px;max-width:100%}dl{width:100%;font-size:12.5px}.fact{grid-template-columns:82px 1fr;padding:5px 0;gap:10px}.portal{border-radius:70px}.portal-heading{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style></head><body>
